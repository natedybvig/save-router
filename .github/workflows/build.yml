name: Build Save Router

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build the app
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk SaveRouter.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SaveRouter
          path: SaveRouter.apk
      - name: Publish to the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create "v1.0.${{ github.run_number }}" SaveRouter.apk \
            --latest \
            --title "Save Router 1.0.${{ github.run_number }}" \
            --notes "Download SaveRouter.apk to install. Obtainium users get this update automatically."
